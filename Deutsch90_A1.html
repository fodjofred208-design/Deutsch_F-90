<script>
'use strict';
/* Deutsch 90 — all core content is embedded so the file works from file://. */
const STORAGE={progress:'deutsch90_progress',notes:'deutsch90_notes',vocab:'deutsch90_vocab',scores:'deutsch90_scores',streak:'deutsch90_streak',current:'deutsch90_current_day',settings:'deutsch90_settings'};
const REVIEW_DAYS=[7,14,21,28,35,42,49,56,63,70,77,84];
const $=(selector,root=document)=>root.querySelector(selector);
const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
const escapeHTML=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addDays=(iso,days)=>{const d=new Date(`${iso}T12:00:00`);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(`${b}T12:00:00`)-new Date(`${a}T12:00:00`))/86400000);
const slug=(text)=>String(text).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const V=(de,en,category,opts={})=>({id:slug(`${de}-${en}`),de,en,category,plural:opts.plural||'',past:opts.past||'',type:opts.type||'phrase'});
const N=(article,word,plural,en,category)=>V(`${article} ${word}`,en,category,{plural,type:'noun'});
const W=(word,en,category,past='')=>V(word,en,category,{past,type:'verb'});
const A=(word,en,category)=>V(word,en,category,{type:'adjective'});
const L=(day,title,icon,objectives,vocabulary,grammar,listening,speaking,pronunciation,writing,culture,resource,exercise,checkpoint)=>({day,title,icon,objectives,vocabulary,grammar,listening,speaking,pronunciation,writing,culture,resource,exercise,checkpoint,week:day<=84?Math.ceil(day/7):null,review:REVIEW_DAYS.includes(day)});
const LESSONS=[
L(1,'Willkommen!','👋',['saluer quelqu’un avec confiance','dire son nom et son pays','reconnaître les pronoms personnels'],[
 V('Hallo','hello','greetings'),V('Guten Morgen','good morning','greetings'),V('Guten Tag','good day / hello','greetings'),V('Danke','thank you','greetings'),V('Bitte','please / you’re welcome','greetings'),V('Ich heiße …','my name is …','introductions')],
 {topic:'Les pronoms personnels et le verbe sein',explanation:'En allemand, le pronom indique qui parle. On mémorise dès aujourd’hui : ich = je, du = tu, er = il, sie = elle, es = il/elle neutre, wir = nous, ihr = vous pluriel, Sie = vous formel.',examples:['Ich bin Amina. — Je suis Amina.','Du bist freundlich. — Tu es sympathique.','Sie sind Herr Müller. — Vous êtes Monsieur Müller.'],exercise:'Complète : Ich ___ aus Kamerun. / Wir ___ Anfänger.',answer:'bin / sind',mistakes:'Ne confonds pas du bist et Sie sind. Sie prend toujours une majuscule quand il signifie vous formel.'},
'Prononce Hallo avec un h léger et Guten avec un u long. Lis lentement : Hallo! Ich heiße …',
'Dis à voix haute : « Hallo! Ich heiße ___. Ich komme aus ___. Ich lerne Deutsch. » Puis recommence sans lire.',
'Le h de Hallo est audible mais doux. Dans heiße, ß se prononce comme ss : haï-seu.',
'Écris cinq phrases : Hallo! / Ich heiße … / Ich komme aus … / Ich lerne Deutsch. / Guten Tag!',
'L’Allemagne se situe au centre de l’Europe et sa capitale est Berlin. Hallo est courant dans un contexte détendu ; Guten Morgen s’emploie le matin. Les pays germanophones comprennent notamment l’Allemagne, l’Autriche, la Suisse, le Luxembourg et le Liechtenstein. Les usages varient selon la personne et le contexte : il n’existe pas un comportement unique pour tous les germanophones.',
{label:'DW Learn German — première prise en main',url:'https://learngerman.dw.com/'},'Choisis le salut adapté : 08:00 → Guten Morgen ; 15:00 → Guten Tag ; à un ami → Hallo.', 'Peux-tu te présenter pendant 30 secondes avec au moins trois phrases allemandes ?'),
L(2,'L’alphabet et épeler son nom','🔤',['épeler son prénom','identifier les lettres allemandes','poser une question simple'],[
 V('der Buchstabe','letter','foundations',{plural:'die Buchstaben',type:'noun'}),V('das Alphabet','alphabet','foundations',{plural:'die Alphabete',type:'noun'}),V('Wie schreibt man das?','How do you spell that?','introductions'),V('richtig','correct','foundations'),V('falsch','wrong','foundations'),V('der Name','name','people',{plural:'die Namen',type:'noun'})],
 {topic:'sein au présent : affirmation et question',explanation:'Le verbe sein est irrégulier. Une question oui/non commence souvent par le verbe : Bist du …? La réponse peut être Ja, ich bin … ou Nein, ich bin nicht …',examples:['Ich bin Fred. — Je suis Fred.','Bist du Léa? — Es-tu Léa ?','Nein, ich bin nicht Léa.'],exercise:'Remets en ordre : bist / du / Maria / ?',answer:'Bist du Maria?',mistakes:'Une question oui/non ne commence pas par Ich bist. Le verbe conjugué vient en première position.'},
'Écoute les lettres allemandes sur le module de prononciation du Goethe-Institut, puis épelle ton nom.',
'Fais un mini-dialogue : A demande Wie heißt du? B répond Ich heiße … et épelle son prénom.',
'Le w allemand ressemble à v en français : wie se prononce vi. Le v peut se prononcer f dans Vater, mais souvent v dans les mots internationaux.',
'Écris ton prénom, ton nom et une phrase qui les épelle : Mein Name ist … .',
'Les noms de famille et prénoms se présentent de façons variées en Allemagne. Dans une administration, on peut demander le nom de famille séparément : Familienname. La forme d’adresse dépend de la relation, de l’âge et de l’institution.',
{label:'Goethe-Institut — alphabet et prononciation',url:'https://www.goethe.de/'},'Épelle « Anna » : A – N – N – A. Demande ensuite Wie schreibt man das?', 'Peux-tu épeler ton prénom sans regarder l’alphabet ?'),
L(3,'Les sons allemands','🗣️',['distinguer ä, ö, ü et ß','prononcer ch dans deux contextes','compter de 0 à 20'],[
 V('null','zero','numbers'),V('eins','one','numbers'),V('zehn','ten','numbers'),V('zwanzig','twenty','numbers'),V('die Zahl','number','numbers',{plural:'die Zahlen',type:'noun'}),V('tschüss','bye','greetings')],
 {topic:'haben au présent',explanation:'Haben signifie avoir. La forme ich habe et du hast sont très fréquentes pour l’âge et les possessions.',examples:['Ich habe Zeit. — J’ai le temps.','Du hast ein Buch. — Tu as un livre.','Haben Sie Fragen? — Avez-vous des questions ?'],exercise:'Complète : Ich ___ 20 Jahre alt. / ___ du Zeit?',answer:'habe / Hast',mistakes:'On dit Ich bin 20 Jahre alt, pas Ich habe 20 Jahre pour l’âge ; haben sert pour une chose possédée.'},
'Fais écouter au synthétiseur : fünf, schön, Tür, Straße, ich. Compare avec ta propre voix.',
'Répète : Ich habe Zeit. Du hast ein Buch. Ich bin Anfänger. Puis compte 0–20.',
'ü se fait avec la bouche de u mais la langue de i ; ö avec la bouche de o et la langue de é. ß est un s long, comme ss.',
'Écris les nombres 0 à 20 en allemand, puis trois phrases avec haben.',
'La lettre ß s’appelle Eszett et se trouve dans Straße (rue) ou heißen (s’appeler). L’orthographe allemande varie selon les mots et les régions d’usage, mais ces sons sont utiles partout dans les pays germanophones.',
{label:'Goethe-Institut — sons et lettres',url:'https://www.goethe.de/'},'Associe : ü → Tür ; ö → schön ; ch → ich ; ß → Straße.', 'Peux-tu prononcer cinq mots contenant ä, ö, ü, ß ou ch sans les franciser ?'),
L(4,'Les nombres et le téléphone','🔢',['compter de 21 à 100','dire un numéro de téléphone','poser l’âge de quelqu’un'],[
 V('einundzwanzig','twenty-one','numbers'),V('dreißig','thirty','numbers'),V('fünfzig','fifty','numbers'),V('hundert','hundred','numbers'),V('Wie alt bist du?','How old are you?','introductions'),V('die Telefonnummer','telephone number','technology',{plural:'die Telefonnummern',type:'noun'})],
 {topic:'Questions avec sein et haben',explanation:'Pour obtenir une information simple, place le verbe en première position : Bist du …? Hast du …? Le mot interrogatif wie alt vient avant le verbe.',examples:['Wie alt bist du? — Ich bin 25 Jahre alt.','Hast du eine Telefonnummer? — Ja, ich habe …','Sind Sie aus Kamerun? — Ja, ich bin aus Kamerun.'],exercise:'Forme la question pour « tu as un téléphone ».',answer:'Hast du ein Telefon?',mistakes:'Dans 21–99, l’unité vient avant und : einundzwanzig. hundert ne prend pas de -s.'},
'Écoute une série de nombres et écris ce que tu entends. Utilise le bouton « écouter » de la page Listening.',
'Joue à l’appel téléphonique : donne ton numéro lentement, puis demande Wie bitte? et répète.',
'Les nombres composés demandent un rythme régulier : ein-und-zwan-zig. Ne prononce pas und comme « ou » français.',
'Écris dix nombres entre 21 et 100 en lettres. Puis écris un faux numéro de téléphone avec les chiffres espacés.',
'Les numéros de téléphone et les dates sont souvent séparés en groupes pour faciliter la compréhension. Dans un échange réel, demander Wie bitte? est normal et poli.',
{label:'DW Learn German — nombres et présentations',url:'https://learngerman.dw.com/'},'Écris en allemand : 24 = vierundzwanzig ; 58 = achtundfünfzig ; 100 = hundert.', 'Peux-tu dire ton âge et un numéro fictif sans mélanger les unités et les dizaines ?'),
L(5,'Se présenter complètement','🪪',['donner nom, âge, origine et langues','utiliser kommen et sprechen','comprendre une présentation courte'],[
 V('kommen','to come / be from','verbs','kam'),W('sprechen','to speak','verbs','sprach'),V('Deutsch','German','languages'),V('Französisch','French','languages'),V('die Sprache','language','languages',{plural:'die Sprachen',type:'noun'}),V('aus','from','prepositions')],
 {topic:'Conjugaison de base : kommen et sprechen',explanation:'Les verbes réguliers prennent des terminaisons. Les verbes fréquents irréguliers comme sprechen changent parfois de voyelle à du : du sprichst.',examples:['Ich komme aus Douala. — Je viens de Douala.','Ich spreche Französisch. — Je parle français.','Du sprichst Deutsch. — Tu parles allemand.'],exercise:'Complète : Ich ___ aus Kamerun. Du ___ Deutsch.',answer:'komme / sprichst',mistakes:'La terminaison de ich est souvent -e ; celle de du est souvent -st, mais certains verbes changent aussi de voyelle.'},
'Écoute une présentation lente et relève le nom, la ville et les langues. Rejoue une deuxième fois avec le texte.',
'Enregistre-toi (ou parle sans enregistreur) : Ich heiße …, ich bin … Jahre alt, ich komme aus …, ich spreche … .',
'Le r allemand peut être uvulaire ou roulé selon les personnes. Cherche surtout une articulation claire ; la variation régionale est normale.',
'Écris une fiche de présentation en cinq phrases. Relis les majuscules des noms et le verbe en deuxième position.',
'Les identités linguistiques et nationales sont diverses. Une personne peut parler plusieurs langues et vivre dans un pays différent de celui de sa naissance. Évite de déduire la langue d’une personne à partir de son apparence.',
{label:'DW Learn German — se présenter',url:'https://learngerman.dw.com/'},'Transforme les notes en phrase : Amina / 22 / Kamerun / Französisch, Englisch → Amina ist 22 Jahre alt …', 'Peux-tu te présenter en 45 secondes avec au moins quatre informations ?'),
L(6,'Révision des fondations','🧩',['réutiliser les salutations et pronoms','réviser sein, haben et les nombres','corriger une présentation'],[
 V('lernen','to learn','verbs','lernte'),W('die Frage','question','classroom',{plural:'die Fragen'}),V('die Antwort','answer','classroom',{plural:'die Antworten'}),V('ja','yes','greetings'),V('nein','no','greetings'),V('Entschuldigung','excuse me / sorry','greetings')],
 {topic:'Phrase déclarative : verbe en deuxième position',explanation:'Dans une phrase simple allemande, le verbe conjugué occupe généralement la deuxième position : Ich lerne Deutsch. Le premier élément peut changer, mais le verbe reste en deuxième position : Heute lerne ich Deutsch.',examples:['Ich lerne Deutsch. — J’apprends l’allemand.','Heute bin ich müde. — Aujourd’hui je suis fatigué.','Ich habe eine Frage. — J’ai une question.'],exercise:'Remets en ordre : heute / Deutsch / lerne / ich.',answer:'Heute lerne ich Deutsch.',mistakes:'Deuxième position signifie deuxième élément, pas forcément deuxième mot. Le verbe doit rester avant le sujet si un complément commence la phrase.'},
'Écoute ta présentation du jour 5 et marque les mots que tu reconnais immédiatement. Réécoute seulement les mots difficiles.',
'Réalise trois tours : salut, présentation, question à un partenaire imaginaire. Réponds à Wie heißt du? Wie alt bist du? Woher kommst du?',
'Fais des pauses entre les groupes de sens, pas entre chaque mot. L’intonation monte souvent dans une question oui/non.',
'Écris une mini-présentation de cinq phrases sans dictionnaire, puis corrige seulement avec tes notes.',
'Les salutations ne sont pas des règles absolues : Hallo peut être approprié dans beaucoup de contextes détendus, tandis que Guten Tag est plus neutre. Observe toujours la situation et les préférences de la personne.',
{label:'Goethe-Institut — entraînement A1',url:'https://www.goethe.de/'},'Corrige : Ich bin kommen aus Kamerun. → Ich komme aus Kamerun. / Heute Deutsch lerne ich. → Heute lerne ich Deutsch.', 'Peux-tu repérer une erreur de verbe et une erreur d’ordre des mots dans tes propres phrases ?'),
L(7,'Test 1 · Fondations','✅',['évaluer salutations, pronoms et sein/haben','réutiliser nombres et présentation','identifier une priorité pour la semaine suivante'],[
 V('die Prüfung','test / examination','classroom',{plural:'die Prüfungen'}),V('wiederholen','to review','verbs','wiederholte'),W('wissen','to know','verbs','wusste'),V('gut gemacht!','well done!','classroom'),V('noch einmal','once again','classroom')],
 {topic:'Bilan : pronoms, sein, haben et ordre simple',explanation:'Combine les fondations : pronom + verbe conjugué + information. Utilise le verbe en deuxième position dans une phrase déclarative et en première position dans une question oui/non.',examples:['Ich bin Anfänger.','Hast du Zeit? — Ja, ich habe Zeit.','Heute lerne ich Zahlen.'],exercise:'Traduis : « Je suis de Douala et j’apprends l’allemand. »',answer:'Ich komme aus Douala und lerne Deutsch.',mistakes:'Relis ich bin / ich habe / ich komme. Ne transforme pas automatiquement le français « avoir » en haben pour l’âge.'},
'Fais le mini-dialogue de test à vitesse lente, sans sous-titres. Puis vérifie les mots avec le script de ta présentation.',
'Partie orale : présente-toi 30–60 secondes et pose deux questions à ton partenaire imaginaire. Utilise un mémo, puis enlève-le.',
'Enregistre une phrase avec ch, ü et ß. Écoute-la et note un son à améliorer, sans chercher la perfection.',
'Écris cinq phrases de présentation en temps limité (cinq minutes). Vérifie capitales, verbe et ponctuation.',
'Le test est une photographie, pas un jugement sur ton identité. Les niveaux de départ, accents et habitudes d’étude diffèrent. Note une réussite et un objectif concret pour la semaine 2.',
{label:'Goethe-Institut — exercices A1',url:'https://www.goethe.de/'},'Mini-test oral : 1 Hallo 2 Ich heiße … 3 Ich komme aus … 4 Ich spreche … 5 Ich lerne Deutsch.', 'Sais-tu comprendre une présentation très courte et produire cinq phrases compréhensibles ?'),

L(8,'Mein Name, mein Alter','🧑',['demander et dire le nom et l’âge','reconnaître der, die, das','utiliser un nom avec son article'],[
 N('der','Mann','die Männer','man','people'),N('die','Frau','die Frauen','woman','people'),N('das','Kind','die Kinder','child','people'),N('der','Name','die Namen','name','people'),V('alt','old','people'),V('Jahre alt','years old','people')],
 {topic:'Les articles définis : der, die, das',explanation:'Chaque nom allemand a un genre grammatical. Apprends le nom avec son article : der Mann, die Frau, das Kind. Le genre grammatical ne décrit pas nécessairement une personne réelle.',examples:['Der Mann ist freundlich.','Die Frau lernt Deutsch.','Das Kind ist fünf Jahre alt.'],exercise:'Choisis l’article : ___ Name, ___ Frau, ___ Kind.',answer:'der Name, die Frau, das Kind',mistakes:'Ne mémorise pas seulement « Name ». L’article fait partie du vocabulaire et aide ensuite pour les cas.'},
'Écoute trois présentations et lève un doigt quand tu entends Mann, Frau ou Kind. Vérifie avec la transcription.',
'Demande : Wie heißt du? Wie alt bist du? Réponds avec Ich heiße … et Ich bin … Jahre alt.',
'Dans Name, le a est long. Dans Jahre, le j se prononce comme y dans « yaourt ».',
'Écris trois mini-profils : une personne, son nom, son âge et une phrase avec l’article correct.',
'Les prénoms et titres d’adresse ne fonctionnent pas partout de la même manière. Dans de nombreux contextes, demander le nom complet avant de passer au prénom peut être plus formel ; observe les indications de la personne.',
{label:'DW Learn German — personnes et présentations',url:'https://learngerman.dw.com/'},'Classe : der Mann / die Frau / das Kind. Ajoute le pluriel quand tu peux.', 'Peux-tu dire l’article avant chaque nom sans traduire d’abord ?'),
L(9,'Pays, nationalités et langues','🌍',['dire d’où l’on vient','nommer des langues','poser Woher kommst du?'],[
 V('das Land','country','people',{plural:'die Länder'}),N('die','Stadt','die Städte','city','places'),V('Kamerun','Cameroon','countries'),V('Deutschland','Germany','countries'),V('Österreich','Austria','countries'),V('Englisch','English','languages')],
 {topic:'L’article indéfini : ein et eine',explanation:'Ein s’emploie avec un nom masculin ou neutre au nominatif ; eine avec un nom féminin. Comme l’article défini, il accompagne le nom.',examples:['Das ist ein Mann. — C’est un homme.','Das ist eine Stadt. — C’est une ville.','Ich habe ein Land? — phrase à éviter sans contexte ; dis plutôt Ich komme aus einem Land.'],exercise:'Complète : Das ist ___ Frau. Das ist ___ Kind.',answer:'eine / ein',mistakes:'Ne dis pas ein Frau. Le genre du nom détermine l’article, pas la personne qui parle.'},
'Écoute des noms de pays et relève l’accent tonique. Répète Deutschland, Österreich, Kamerun et Frankreich.',
'Joue à la carte d’identité : Woher kommst du? Welche Sprachen sprichst du? Réponds en deux phrases.',
'Le sch dans Deutsch se prononce comme « ch » de chat, mais sp et st en début de mot se prononcent souvent « chp » et « cht » : sprechen, Straße.',
'Écris six phrases : pays, ville, langue(s), puis trois phrases avec ein/eine.',
'L’allemand est une langue pluricentrique : en Allemagne, en Autriche, en Suisse et ailleurs, la prononciation et certains mots peuvent varier. Le statut de langue ne dit rien sur la valeur de ses locuteurs.',
{label:'Goethe-Institut — allemand dans le monde',url:'https://www.goethe.de/'},'Réponds : Woher kommst du? — Ich komme aus … / Welche Sprachen sprichst du? — Ich spreche …', 'Peux-tu distinguer la question sur le pays (Woher) de celle sur la langue (Welche Sprachen) ?'),

const GRAMMAR_TOPICS=[
 {id:'pronouns',title:'Personalpronomen',level:'Fondations',explanation:'Les pronoms remplacent une personne ou une chose. Le choix du pronom influence la conjugaison. Sie formel prend une majuscule.',examples:['ich = je · du = tu · er/sie/es = il/elle/neutre','wir = nous · ihr = vous pluriel informel · Sie = vous formel'],exercise:'Complète : ___ lerne Deutsch. (je) / ___ sind Sie? (qui, formel)',answer:'Ich / Wer',mistakes:'Ne confonds pas sie (elle/ils) et Sie (vous formel).',tip:'Apprends le pronom avec la terminaison du verbe.'},
 {id:'sein',title:'sein · être',level:'Fondations',explanation:'sein est irrégulier et indispensable pour l’identité, l’état et la localisation.',examples:['ich bin · du bist · er/sie/es ist','wir sind · ihr seid · Sie/sie sind'],exercise:'Traduis : Nous sommes débutants. / Es-tu fatigué ?',answer:'Wir sind Anfänger. / Bist du müde?',mistakes:'ich bin, jamais ich bist ; ihr seid, jamais ihr sind.',tip:'Récite la série à voix haute avec un rythme régulier.'},
 {id:'haben',title:'haben · avoir',level:'Fondations',explanation:'haben sert à parler de possession et apparaît dans de nombreuses expressions.',examples:['ich habe · du hast · er/sie/es hat','Wir haben Zeit. · Hast du eine Frage?'],exercise:'Complète : Du ___ ein Buch. Wir ___ Zeit.',answer:'hast / haben',mistakes:'L’âge se dit Ich bin 20 Jahre alt, non Ich habe 20 Jahre.',tip:'Associe habe/hast/hat à des objets de ta journée.'},
 {id:'regular',title:'Verbes réguliers',level:'A1',explanation:'Base fréquente : radical + e, st, t, en, t, en. Le verbe conjugué reste en position 2 dans une phrase déclarative.',examples:['lernen : ich lerne, du lernst, er lernt, wir lernen','arbeiten : ich arbeite, du arbeitest, wir arbeiten'],exercise:'Conjugue machen avec ich, du, wir.',answer:'ich mache, du machst, wir machen',mistakes:'Ne laisse pas l’infinitif après ich : Ich lernen est incorrect.',tip:'Repère d’abord le sujet, puis choisis la terminaison.'},
 {id:'articles',title:'Articles définis · der die das',level:'Fondations',explanation:'Chaque nom a un genre grammatical. Mémorise l’article au même moment que le nom, et son pluriel.',examples:['der Tisch · die Lampe · das Kind','Au pluriel, l’article défini est die : die Tische, die Lampen, die Kinder.'],exercise:'Choisis : ___ Bahnhof, ___ Küche, ___ Fenster.',answer:'der Bahnhof, die Küche, das Fenster',mistakes:'Le genre grammatical n’est pas une règle sur le sexe réel ou la personnalité.',tip:'Crée des cartes avec article + singulier + pluriel.'},
 {id:'indefinite',title:'ein · eine',level:'A1',explanation:'Au nominatif : ein pour masculin/neutre, eine pour féminin. À l’accusatif masculin, ein devient einen.',examples:['ein Tisch · eine Lampe · ein Kind','Ich kaufe einen Tisch. · Ich sehe eine Lampe.'],exercise:'Complète : Das ist ___ Mann und ___ Frau.',answer:'ein Mann und eine Frau',mistakes:'Ne dis pas ein Frau ; vérifie le genre du nom.',tip:'Apprends trois colonnes : der/ein, die/eine, das/ein.'},
 {id:'nominative',title:'Nominatif',level:'A1',explanation:'Le nominatif est le cas du sujet, c’est-à-dire la personne ou la chose qui fait l’action ou est décrite.',examples:['Der Mann arbeitet. · Die Frau lernt. · Das Kind schläft.','Meine Schwester ist nett.'],exercise:'Quel est le sujet : Die Lampe ist auf dem Tisch.',answer:'Die Lampe',mistakes:'Ne choisis pas le nom après la préposition comme sujet.',tip:'Demande : qui/quoi fait l’action ou est décrit ?'},
 {id:'accusative',title:'Accusatif',level:'A1',explanation:'L’objet direct répond souvent à wen/was. Dans la série débutante, seul le masculin défini/indéfini change : der → den, ein → einen.',examples:['Ich sehe den Mann. · Ich habe einen Stift.','Ich kaufe die Hose. · Ich lese ein Buch.'],exercise:'Corrige : Ich brauche ein Termin. / Ich sehe der Bus.',answer:'Ich brauche einen Termin. / Ich sehe den Bus.',mistakes:'Ne change pas automatiquement féminin et neutre : die/eine, das/ein restent identiques ici.',tip:'Entoure le verbe, puis demande « quoi ? ».'},
 {id:'dative',title:'Introduction au datif',level:'A1+',explanation:'Le datif apparaît avec certains verbes et prépositions. Commence par mémoriser des blocs : mit dem Bus, zum Arzt, zur Schule, bei der Arbeit.',examples:['Ich fahre mit dem Zug. · Ich gehe zum Arzt.','Ich bin bei der Freundin.'],exercise:'Complète : mit ___ Bus / zu___ Schule.',answer:'mit dem Bus / zur Schule',mistakes:'Le datif ne se réduit pas à « masculin = dem » : l’expression et le verbe comptent.',tip:'Utilise les phrases de transport avant de construire le tableau complet.'},
 {id:'plural',title:'Pluriels',level:'A1',explanation:'Les pluriels prennent die à l’article défini, mais la terminaison varie. Apprends chaque nom avec son pluriel.',examples:['der Tisch → die Tische · die Lampe → die Lampen','das Buch → die Bücher · das Kind → die Kinder'],exercise:'Donne le pluriel : der Stuhl, das Haus, die Tasche.',answer:'die Stühle, die Häuser, die Taschen',mistakes:'Ne mets pas -s partout et n’oublie pas les umlauts.',tip:'Classe les pluriels par familles, mais vérifie toujours dans le dictionnaire.'},
 {id:'negation',title:'nicht et kein',level:'A1',explanation:'nicht nie un verbe, adjectif ou groupe ciblé ; kein nie un nom indéfini. Kein varie comme ein : kein, keine, keinen.',examples:['Das ist nicht teuer. · Ich lerne nicht heute.','Ich habe kein Geld. · Ich möchte keine Dose.'],exercise:'Choisis : Ich habe ___ Zeit. / Der Zug ist ___ pünktlich.',answer:'keine Zeit / nicht pünktlich',mistakes:'Ne dis pas nicht Zeit pour « pas de temps » dans ce modèle.',tip:'Si un nom sans article défini est nié, pense à kein.'},
 {id:'word-order',title:'Ordre des mots',level:'A1',explanation:'Dans une phrase principale, le verbe conjugué est en deuxième position. Si un complément commence la phrase, le sujet vient après le verbe.',examples:['Ich lerne Deutsch. · Heute lerne ich Deutsch.','Am Abend sehe ich fern.'],exercise:'Corrige : Morgen ich fahre mit dem Bus.',answer:'Morgen fahre ich mit dem Bus.',mistakes:'Deuxième position signifie deuxième groupe, pas forcément deuxième mot.',tip:'Surligne le verbe conjugué avant de déplacer les autres éléments.'},
 {id:'questions',title:'Questions oui/non',level:'A1',explanation:'Une question oui/non commence généralement par le verbe conjugué.',examples:['Bist du müde? · Hast du Zeit? · Kommst du mit?','Réponds avec une phrase : Ja, ich habe Zeit.'],exercise:'Transforme : Du lernst Deutsch.',answer:'Lernst du Deutsch?',mistakes:'Ne garde pas le sujet avant le verbe dans cette structure.',tip:'Retourne les deux premières pièces de la phrase.'},
 {id:'w-questions',title:'W-Fragen',level:'A1',explanation:'Le mot interrogatif vient d’abord, puis le verbe conjugué et le sujet : Wo wohnst du? Les mots fréquents sont wer, was, wo, wann, wie, warum, wohin, woher.',examples:['Woher kommst du? · Was machst du? · Wann beginnt der Kurs?','Warum lernst du Deutsch?'],exercise:'Forme : wie / du / heißen ?',answer:'Wie heißt du?',mistakes:'Le verbe vient avant le sujet dans la question.',tip:'Choisis le mot interrogatif selon le type d’information recherché.'},
 {id:'modals',title:'Modalverben',level:'A1',explanation:'können, müssen et dürfen se conjuguent en position 2 ; l’infinitif va en fin de phrase.',examples:['Ich kann Deutsch sprechen. · Ich muss arbeiten.','Darf ich hier warten? · Du kannst kommen.'],exercise:'Traduis : Je dois étudier aujourd’hui.',answer:'Ich muss heute lernen.',mistakes:'Ne conjugue pas l’infinitif final : Ich muss lerne est faux.',tip:'Encadre l’infinitif final comme une destination.'},
 {id:'separable',title:'Verbes séparables',level:'A1',explanation:'Dans une phrase principale, le préfixe séparable se place à la fin : Ich stehe um sieben Uhr auf.',examples:['Ich kaufe am Samstag ein. · Ich rufe meine Mutter an.','Ich sehe am Abend fern.'],exercise:'Construis : ich / morgen / aufstehen.',answer:'Ich stehe morgen auf.',mistakes:'Ne laisse pas le préfixe collé au verbe conjugué dans la phrase principale.',tip:'Apprends l’infinitif et la phrase modèle ensemble.'},
 {id:'prepositions',title:'Prépositions essentielles',level:'A1',explanation:'in, auf, unter, neben, vor, hinter localisent ; mit, nach, zu indiquent souvent déplacement ou moyen. Les groupes de datif sont à mémoriser.',examples:['Das Buch ist in der Tasche. · Die Lampe ist auf dem Tisch.','Ich fahre mit dem Bus nach Berlin. · Ich gehe zum Arzt.'],exercise:'Choisis : Ich fahre ___ Zug ___ Hamburg.',answer:'mit dem Zug nach Hamburg',mistakes:'Wo? et Wohin? n’ont pas la même logique. Utilise des blocs sûrs.',tip:'Associe chaque préposition à une image et une phrase.'},
 {id:'time',title:'Expressions de temps',level:'A1',explanation:'am Montag, im Sommer, um acht Uhr, von 9 bis 18 Uhr, heute, morgen et gestern organisent la phrase.',examples:['Am Montag lerne ich. · Um acht Uhr beginnt der Kurs.','Heute stehe ich früh auf.'],exercise:'Écris une phrase avec am Montag et um 9 Uhr.',answer:'Am Montag lerne ich um 9 Uhr Deutsch.',mistakes:'halb neun signifie 8 h 30, pas 9 h 30.',tip:'Utilise d’abord les horaires numériques pour être clair.'},
 {id:'conjunctions',title:'Conjonctions de base',level:'A1',explanation:'und et aber relient des idées et gardent l’ordre de la phrase principale. weil introduit une proposition avec le verbe à la fin, à reconnaître d’abord.',examples:['Ich lerne und ich spreche. · Ich mag Tee, aber keinen Kaffee.','Ich lerne, weil Deutsch interessant ist.'],exercise:'Relie : Ich bin müde. Ich lerne Deutsch.',answer:'Ich bin müde, aber ich lerne Deutsch. / Ich lerne Deutsch, weil …',mistakes:'Après weil, le verbe va à la fin ; avec und/aber, il reste en deuxième position.',tip:'Commence par und/aber avant de produire weil.'},
 {id:'possessive',title:'Possessifs mein / meine',level:'A1',explanation:'mein accompagne le masculin et le neutre au nominatif ; meine accompagne le féminin et le pluriel. À l’accusatif masculin : meinen.',examples:['mein Bruder · meine Schwester · mein Kind','Ich sehe meinen Bruder.'],exercise:'Complète : ___ Mutter und ___ Bruder.',answer:'meine Mutter und mein Bruder',mistakes:'Le possessif s’accorde avec le nom, pas avec la personne qui possède.',tip:'Regroupe les formes avec l’article.'}

function readJSON(key,fallback){try{const raw=localStorage.getItem(key);if(!raw)return fallback;const parsed=JSON.parse(raw);return parsed??fallback}catch(error){console.warn(`Deutsch 90: données ${key} illisibles`,error);return fallback}}
function validDayList(value){return Array.isArray(value)?[...new Set(value.filter(n=>Number.isInteger(n)&&n>=1&&n<=90))].sort((a,b)=>a-b):[]}
function loadState(){
 const progress=readJSON(STORAGE.progress,{}); const noteData=readJSON(STORAGE.notes,{}); const vocabData=readJSON(STORAGE.vocab,{}); const scoreData=readJSON(STORAGE.scores,[]); const streakData=readJSON(STORAGE.streak,{}); const settingsData=readJSON(STORAGE.settings,{}); const currentData=readJSON(STORAGE.current,1);
 state.completed=validDayList(progress.completed); state.started=Boolean(progress.started||progress.onboardingComplete);
 state.currentDay=Number.isInteger(currentData)&&currentData>=1&&currentData<=90?currentData:(Number.isInteger(progress.currentDay)?progress.currentDay:1);
 state.notes=noteData&&typeof noteData==='object'&&!Array.isArray(noteData)?noteData:{};
 state.vocab=vocabData&&typeof vocabData==='object'&&!Array.isArray(vocabData)?vocabData:{};
 state.scores=Array.isArray(scoreData)?scoreData.filter(s=>s&&typeof s==='object'&&Number.isFinite(s.score)&&Number.isFinite(s.total)&&s.total>0):[];
 state.streak=streakData&&typeof streakData==='object'?{current:Number(streakData.current)||0,best:Number(streakData.best)||0,lastDate:typeof streakData.lastDate==='string'?streakData.lastDate:null}:{...state.streak};
 state.settings=cleanSettings(settingsData);
 state.currentDay=Math.min(90,Math.max(1,state.currentDay));
 applySettings();
}
function writeJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(error){console.warn(`Deutsch 90: impossible d’enregistrer ${key}`,error);return false}}
function saveState(){
 writeJSON(STORAGE.progress,{completed:state.completed,started:state.started,currentDay:state.currentDay});
 writeJSON(STORAGE.notes,state.notes);writeJSON(STORAGE.vocab,state.vocab);writeJSON(STORAGE.scores,state.scores);writeJSON(STORAGE.streak,state.streak);writeJSON(STORAGE.current,state.currentDay);writeJSON(STORAGE.settings,state.settings);
}
function nextLearningDay(){if(!state.completed.length)return 1;const last=Math.max(...state.completed);return last<90?last+1:90}
function recalcCurrent(){state.currentDay=nextLearningDay();writeJSON(STORAGE.current,state.currentDay)}
function completedCount(){return state.completed.length}
function progressPercent(){return Math.round(completedCount()/90*100)}
function hoursCompleted(){return completedCount()*2}
function currentWeek(){return state.currentDay<=84?Math.ceil(state.currentDay/7):'Final'}
function isComplete(day){return state.completed.includes(day)}

function readiness(){const dayScore=progressPercent();const testScore=averageScore();const vocab=vocabStats().percent;return Math.round(dayScore*.25+testScore*.55+vocab*.2)}

function vocabRecord(id){return state.vocab[id]||{box:0,lastReviewed:null,nextReview:null,correct:0,incorrect:0}}
function isDue(v){const r=vocabRecord(v.id);return !r.nextReview||r.nextReview<=todayISO()}
function filteredVocabulary(){let items=allVocabulary();if(state.vocabCategory!=='all')items=items.filter(v=>v.category===state.vocabCategory);if(state.vocabSearch){const q=state.vocabSearch.toLowerCase();items=items.filter(v=>`${v.de} ${v.en} ${v.plural} ${v.past} ${categoryName(v.category)}`.toLowerCase().includes(q))}if(state.vocabMode==='due')items=items.filter(isDue);return items}
function renderVocabulary(){const all=allVocabulary();const cards=filteredVocabulary();if(cards.length)state.vocabIndex=Math.min(state.vocabIndex,cards.length-1);else state.vocabIndex=0;const card=cards[state.vocabIndex];const cats=[...new Set(all.map(v=>v.category))].sort((a,b)=>categoryName(a).localeCompare(categoryName(b)));const mastered=all.filter(v=>vocabRecord(v.id).box>=4).length;const due=all.filter(isDue).length;return `${pageHead('🃏 Vocabulary','Flashcards, recherche, catégories et répétition espacée locale. Pour les noms : article + nom + pluriel + traduction.',`<a class="btn secondary" href="https://apps.ankiweb.net/" target="_blank" rel="noopener noreferrer">Anki ↗</a>`)}<div class="grid grid-4"><div class="card stat-card"><div class="stat-top"><span>Total cards</span><span>🃏</span></div><div class="stat-value">${all.length}</div><div class="stat-sub">base A1 intégrée</div></div><div class="card stat-card"><div class="stat-top"><span>Studied</span><span>📖</span></div><div class="stat-value">${Object.keys(state.vocab).filter(id=>all.some(v=>v.id===id)).length}</div><div class="stat-sub">cartes vues</div></div><div class="card stat-card"><div class="stat-top"><span>Mastered</span><span>🏆</span></div><div class="stat-value">${mastered}</div><div class="stat-sub">box 4–5</div></div><div class="card stat-card"><div class="stat-top"><span>Due review</span><span>🔁</span></div><div class="stat-value">${due}</div><div class="stat-sub">à revoir aujourd’hui</div></div></div><div class="grid grid-2" style="margin-top:16px"><div class="card"><div class="row between"><div><span class="eyebrow">Flashcard review</span><h3 style="margin:3px 0">${cards.length?`${state.vocabIndex+1} / ${cards.length}`:'Aucune carte'}</h3></div><div class="tag">${state.vocabMode==='due'?'DUE MODE':'ALL MODE'}</div></div><div class="bar" style="margin:13px 0 15px"><span style="width:${cards.length?Math.round((state.vocabIndex+1)/cards.length*100):0}%"></span></div>${card?renderFlashcard(card):`<div class="empty">Aucune carte dans ce filtre. Essaie All ou change de catégorie.</div>`}</div><div class="card"><div class="row between"><h3>Find & filter</h3><button class="filter ${state.vocabMode==='due'?'active':''}" data-action="vocab-mode">${state.vocabMode==='due'?'✓ Due only':'Review due'}</button></div><label class="sr-only" for="vocabSearch">Rechercher un mot</label><input id="vocabSearch" data-input="vocab-search" type="search" value="${escapeHTML(state.vocabSearch)}" placeholder="Ex. Bahnhof, table, Familie…"><label class="small muted" for="vocabCategory" style="display:block;margin:12px 0 5px">Category</label><select id="vocabCategory" data-change="vocab-category"><option value="all">All categories</option>${cats.map(c=>`<option value="${escapeHTML(c)}" ${state.vocabCategory===c?'selected':''}>${escapeHTML(categoryName(c))}</option>`).join('')}</select><div class="category-pills" style="margin-top:12px">${cats.slice(0,10).map(c=>`<button class="filter small-btn ${state.vocabCategory===c?'active':''}" data-action="vocab-category-pill" data-category="${escapeHTML(c)}">${escapeHTML(categoryName(c))}</button>`).join('')}</div><div class="divider"></div><div class="small muted">Basic SRS : <strong class="accent">I Know</strong> augmente l’intervalle (1, 2, 4, 7, 14 jours). <strong>Review Again</strong> remet la carte en box 0.</div></div></div><div class="card" style="margin-top:16px"><div class="row between"><div><h3>German word bank</h3><p class="small muted">Les noms suivent toujours le format demandé. Les verbes montrent une forme passée repère.</p></div><span class="tag">${Math.min(12,cards.length)} affichées</span></div>${cards.length?`<div class="table-scroll"><table class="definition-table"><thead><tr><th>German</th><th>Plural / form</th><th>Translation</th><th>Category</th><th>Status</th></tr></thead><tbody>${cards.slice(0,12).map(v=>`<tr><td class="word">${escapeHTML(v.de)}</td><td>${v.type==='noun'?escapeHTML(v.plural||'—'):escapeHTML(v.past||'—')}</td><td>${escapeHTML(v.en)}</td><td>${escapeHTML(categoryName(v.category))}</td><td>${vocabRecord(v.id).box>=4?'🏆 Mastered':isDue(v)?'🔁 Due':'✓ Learning'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Aucune entrée.</div>`}</div>`}
function renderFlashcard(v){const r=vocabRecord(v.id);return `<div class="flashcard" aria-live="polite"><div class="vocab-meta"><span>${escapeHTML(categoryName(v.category))}</span><span>Box ${r.box}/5</span></div><div><div class="flash-front">${escapeHTML(v.de)}</div>${state.vocabShowAnswer?`<div class="flash-answer"><strong>${v.type==='noun'?escapeHTML(v.plural||'—'):v.past?escapeHTML(v.past):'Phrase / adjective'}</strong><br>${escapeHTML(v.en)}</div>`:`<p class="small muted">Think of the meaning, plural/form and an example.</p>`}</div><div class="flash-controls">${!state.vocabShowAnswer?`<button class="btn primary" data-action="vocab-show">SHOW ANSWER</button>`:`<button class="btn secondary" data-action="vocab-again">↻ REVIEW AGAIN</button><button class="btn primary" data-action="vocab-know">✓ I KNOW</button>`}<button class="btn ghost" data-action="vocab-prev" aria-label="Previous card">←</button><button class="btn ghost" data-action="vocab-next" aria-label="Next card">→</button></div></div>`}
function reviewVocab(known){const cards=filteredVocabulary();const v=cards[state.vocabIndex];if(!v)return;const old=vocabRecord(v.id);const nextBox=known?Math.min(5,old.box+1):0;const interval=known?[1,2,4,7,14,30][nextBox]:0;state.vocab[v.id]={box:nextBox,lastReviewed:todayISO(),nextReview:addDays(todayISO(),interval),correct:(old.correct||0)+(known?1:0),incorrect:(old.incorrect||0)+(known?0:1)};state.vocabShowAnswer=false;saveState();toast(known?`✓ ${v.de} · prochaine révision dans ${interval||0} jour(s)`:`↻ ${v.de} · à revoir`);if(state.vocabMode==='due'&&!isDue(v))state.vocabIndex=state.vocabIndex%Math.max(1,filteredVocabulary().length);render()}

function renderHistoryTimeline(event){return `<div class="grid grid-2"><div class="card"><div class="row between"><div><span class="eyebrow">Interactive timeline</span><h3>${HISTORY.length} milestones</h3></div><span class="tag">${state.historyIndex+1} / ${HISTORY.length}</span></div><div class="timeline" style="margin-top:15px">${HISTORY.map((h,i)=>`<div class="timeline-item ${i===state.historyIndex?'active':''}"><span class="timeline-dot"></span><button class="timeline-button" data-action="history-select" data-index="${i}"><strong>${escapeHTML(h.date)} · ${escapeHTML(h.event)}</strong><span>${i===state.historyIndex?'Open details':'Click to expand'}</span></button></div>`).join('')}</div></div><div class="card"><span class="tag">${escapeHTML(event.date)}</span><h2 style="margin:12px 0 8px">${escapeHTML(event.event)}</h2><h3>What happened?</h3><p>${escapeHTML(event.what)}</p><h3>Why it matters</h3><p class="muted">${escapeHTML(event.why)}</p><h3>Vocabulary</h3><div class="vocab-inline">${event.vocab.map(v=>`<div class="vocab-chip"><strong>${escapeHTML(v.split(' — ')[0])}</strong><span>${escapeHTML(v.split(' — ')[1]||'')}</span></div>`).join('')}</div><div class="divider"></div><h3>Short quiz</h3><p class="deutsch">${escapeHTML(event.quiz.q)}</p><div class="quiz-options">${event.quiz.options.map((o,i)=>`<div class="quiz-option"><input type="radio" id="history-${state.historyIndex}-${i}" name="historyQuiz" value="${i}" ${state.historyAnswer===i?'checked':''}><label for="history-${state.historyIndex}-${i}">${String.fromCharCode(65+i)}. ${escapeHTML(o)}</label></div>`).join('')}</div><button class="btn primary small-btn" style="margin-top:12px" data-action="history-check">CHECK HISTORY ANSWER</button>${state.historyFeedback?`<div class="quiz-feedback ${state.historyFeedback.startsWith('✗')?'incorrect':''}">${escapeHTML(state.historyFeedback)}</div>`:''}<div class="row between" style="margin-top:14px"><button class="btn ghost small-btn" data-action="history-prev" ${state.historyIndex===0?'disabled':''}>← Previous</button><button class="btn secondary small-btn" data-action="history-next" ${state.historyIndex===HISTORY.length-1?'disabled':''}>Next →</button></div></div></div><div class="notice" style="margin-top:16px">⚠️ La période nazie et la Shoah sont présentées historiquement, factuellement et critiquement. Aucune glorification, romantisation ou normalisation de l’idéologie nazie.</div>`}

yle="margin-top:16px">${[['🏥','Gesundheit','Healthcare and insurance involve institutions and professionals; access and experience can vary.'],['🏠','Wohnen','Housing differs by city, countryside, prices, household and social situation.'],['🧾','Verwaltung','Public services use forms, appointments and documents; official sources matter.'],['🚉','Verkehr','Transport networks link regions but offer and delays vary by line.'],['💼','Arbeit','Work culture depends on sector, contract, hierarchy, colleagues and individual preference.'],['👥','Gesellschaft','Society includes regional, linguistic, generational, religious and individual diversity.']].map(([i,t,x])=>`<div class="card compact"><div class="tool-icon">${i}</div><h3 style="margin-top:10px">${t}</h3><p class="small muted" style="margin-bottom:0">${x}</p></div>`).join('')}</div>`}

ks?.[t.id]?'checked':''}> <strong>${escapeHTML(t.title)}</strong><br><span class="small muted">${escapeHTML(t.text)}</span></label>`).join('')}`:''}<button class="btn primary" type="button" data-action="submit-test" style="margin-top:18px">SUBMIT ${state.testId==='final'?'FINAL ASSESSMENT':'TEST'}</button></form>${state.testFeedback&&state.testFeedback.id===state.testId?renderTestFeedback(state.testFeedback):''}</div><div class="stack"><div class="card"><h3>Test categories</h3><div class="grid grid-2">${['Vocabulary','Grammar','Reading','Listening','Speaking','Culture','History','Geography'].map((x,i)=>`<div class="vocab-chip"><strong>${['🧠','📚','📖','🎧','🗣️','🇩🇪','📜','🗺️'][i]} ${x}</strong><span>${i<2?'auto-scored':'practical / included according to test'}</span></div>`).join('')}</div></div><div class="card"><h3>Recent scores</h3>${state.scores.length?state.scores.slice(-8).reverse().map(s=>`<div class="score-row"><span>${s.id==='final'?'🏆 Final A1':'Day '+s.id} · ${formatDate(s.date)}</span><strong class="accent">${s.score}/${s.total} · ${Math.round(s.score/s.total*100)}%</strong></div>`).join(''):`<p class="muted small">Aucun score. Choisis un test et réponds.</p>`}</div><div class="card"><h3>A1 readiness</h3><div class="readiness"><strong class="result-score" style="font-size:28px">${readiness()}%</strong><div class="readiness-meter"><span style="width:${readiness()}%"></span></div></div><p class="tiny muted">Approximation combinant progression des jours, moyenne des tests et maîtrise du vocabulaire. Deutsch 90 n’est pas un examen Goethe officiel.</p></div></div></div>`}
function renderTestQuestion(q,i){const key=`${state.testId}-${i}`;return `<fieldset class="card compact" style="border:1px solid var(--line-soft)"><legend style="font-weight:800;font-size:14px"><span class="tag gray">${escapeHTML(q.category)}</span> ${i+1}. ${escapeHTML(q.q)}</legend><div class="quiz-options" style="margin-top:10px">${q.options.map((o,j)=>`<div class="quiz-option"><input type="radio" id="test-${state.testId}-${i}-${j}" name="test-${i}" value="${j}" ${state.testAnswers[key]===j?'checked':''}><label for="test-${state.testId}-${i}-${j}">${String.fromCharCode(65+j)}. ${escapeHTML(o)}</label></div>`).join('')}</div></fieldset>`}
function renderTestFeedback(feedback){const percent=Math.round(feedback.score/feedback.total*100);return `<div class="callout" style="margin-top:16px"><div class="row between"><div><span class="eyebrow">Result</span><h3 style="margin:3px 0">${percent>=70?'✓ Bien joué':'Continue — tu as des points à consolider'}</h3></div><div class="result-score">${feedback.score}/${feedback.total}</div></div><p>${percent}% · ${feedback.correct} réponse(s) correcte(s), ${feedback.total-feedback.correct} à revoir.</p>${feedback.weak.length?`<p class="small"><strong>Weak areas :</strong> ${feedback.weak.map(escapeHTML).join(', ')}</p>`:''}<p class="small muted"><strong>Recommendation :</strong> ${percent>=80?'Passe au jour suivant et revois les cartes dues.':percent>=60?'Relis la grammaire liée et refais l’écoute.':'Reviens aux leçons de la semaine, puis retente le test.'}</p></div>`}
function analytics(){const completedLessons=LESSONS.filter(l=>isComplete(l.day));const grammarDone=new Set(completedLessons.map(l=>l.grammar.topic)).size;const historyDone=completedLessons.filter(l=>l.day>=71&&l.day<=77).length;const geoDone=completedLessons.filter(l=>l.day>=64&&l.day<=70).length;return {grammarDone,historyDone,geoDone}}

iv><div class="card"><h3>Learning streak</h3><div class="row" style="margin:13px 0"><div class="stat-value">🔥 ${state.streak.current}</div><div class="muted">current ${streakLabel()}<br>🏆 best ${state.streak.best} jours</div></div><p class="small muted">Dernière journée complétée : ${formatDate(state.streak.lastDate)}. Le streak ne bouge que lorsque tu marques un jour terminé, pas quand tu ouvres l’application.</p></div></div><div class="card" style="margin-top:16px"><h3>Learning analytics</h3><div class="grid grid-3"><div><div class="label-row"><span>Grammar topics completed</span><strong>${a.grammarDone}/${GRAMMAR_TOPICS.length}</strong></div><div class="bar"><span style="width:${Math.round(a.grammarDone/GRAMMAR_TOPICS.length*100)}%"></span></div></div><div><div class="label-row"><span>History days completed</span><strong>${a.historyDone}/7</strong></div><div class="bar"><span style="width:${a.historyDone/7*100}%"></span></div></div><div><div class="label-row"><span>Geography days completed</span><strong>${a.geoDone}/7</strong></div><div class="bar"><span style="width:${a.geoDone/7*100}%"></span></div></div></div></div><div class="card" style="margin-top:16px"><div class="row between"><div><h3>90-day map</h3><p class="small muted">✓ Completed · ● Current · ○ Not completed. La couleur n’est jamais le seul signal.</p></div><span class="tag">${completedCount()}/90</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(43px,1fr));gap:7px;margin-top:15px">${LESSONS.map(l=>`<button class="day-number" style="width:100%;height:43px;border:1px solid ${isComplete(l.day)?'var(--accent)':'var(--line)'};background:${isComplete(l.day)?'rgba(168,239,104,.17)':l.day===state.currentDay?'rgba(168,239,104,.07)':'var(--panel)'}" data-action="open-day" data-day="${l.day}" aria-label="Day ${l.day} ${isComplete(l.day)?'completed':l.day===state.currentDay?'current':'not completed'}">${isComplete(l.day)?'✓':l.day===state.currentDay?'●':l.day}</button>`).join('')}</div></div><div class="card" style="margin-top:16px"><h3>Test history</h3>${state.scores.length?state.scores.slice().reverse().map(s=>`<div class="score-row"><span>${s.id==='final'?'🏆 Final A1':'Day '+s.id} · ${formatDate(s.date)}</span><span>${s.score}/${s.total} · <strong class="accent">${Math.round(s.score/s.total*100)}%</strong></span></div>`).join(''):`<p class="muted">Les résultats apparaîtront après ton premier test.</p>`}</div>`}
function renderSettings(){return `${pageHead('⚙️ Settings','Apparence, accessibilité et sauvegarde locale. Aucun compte ni backend.',`<span class="tag">Local-only</span>`)}<div class="grid grid-2"><div class="card"><h3>Appearance & accessibility</h3><div class="setting-row"><div><h3>Theme</h3><p>Dark dashboard ou mode clair.</p></div><div class="setting-control"><select data-change="setting-theme" aria-label="Theme"><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Dark mode</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Light mode</option></select></div></div><div class="setting-row"><div><h3>Font size</h3><p>Petite, moyenne ou grande typographie.</p></div><div class="setting-control"><select data-change="setting-font" aria-label="Font size"><option value="small" ${state.settings.fontSize==='small'?'selected':''}>Small</option><option value="medium" ${state.settings.fontSize==='medium'?'selected':''}>Medium</option><option value="large" ${state.settings.fontSize==='large'?'selected':''}>Large</option></select></div></div><div class="setting-row"><div><h3>Reduced motion</h3><p>Respecte la préférence pour moins d’animations.</p></div><div class="setting-control"><select data-change="setting-motion" aria-label="Reduced motion"><option value="false" ${!state.settings.reducedMotion?'selected':''}>Animations normales</option><option value="true" ${state.settings.reducedMotion?'selected':''}>Réduire</option></select></div></div></div><div class="card"><h3>Backup your learning</h3><p class="muted small">Export JSON télécharge une copie de progression, notes, cartes, scores, streak et réglages. Import valide la structure avant de l’appliquer.</p><div class="stack"><button class="btn primary" data-action="export">⬇ EXPORT deutsch90-backup.json</button><button class="btn secondary" data-action="import">⬆ IMPORT JSON BACKUP</button><p id="importStatus" class="small muted" aria-live="polite">Les sauvegardes restent sur ton appareil tant que tu ne les exportes pas.</p></div><div class="divider"></div><h3>Reset Progress</h3><p class="small muted">Supprime progression, notes, statistiques de vocabulaire et scores après confirmation explicite.</p><button class="btn danger" data-action="reset">RESET PROGRESS</button></div></div><div class="card" style="margin-top:16px"><h3>Data safety</h3><p class="muted">Deutsch 90 utilise localStorage avec des valeurs par défaut sûres. Si une donnée JSON est corrompue, l’application ignore cette donnée et continue de charger au lieu de planter. Pour éviter une perte, exporte une sauvegarde avant une réinitialisation.</p><div class="notice">Current local keys : deutsch90_progress · deutsch90_notes · deutsch90_vocab · deutsch90_scores · deutsch90_streak · deutsch90_current_day · deutsch90_settings</div></div>`}
function normalizeAnswer(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function checkGrammar(){const topic=GRAMMAR_TOPICS.find(g=>g.id===state.grammarId)||GRAMMAR_TOPICS[0];const input=$('#grammarAnswer')?.value.trim();if(!input){state.grammarFeedback='Écris une réponse ou utilise Show answer.';render();return}const expected=normalizeAnswer(topic.answer.split('/')[0]);const given=normalizeAnswer(input);state.grammarFeedback=given&&expected&& (given===expected||given.includes(expected)||expected.includes(given))?`✓ Correct — ${topic.answer}`:`✗ À revoir — réponse attendue : ${topic.answer}`;render()}
function speechVoices(){return 'speechSynthesis' in window?window.speechSynthesis.getVoices():[]}
function speakText(text,requested='de-DE'){const status=$('#speechStatus');if(!('speechSynthesis' in window)){toast('SpeechSynthesis non disponible — lis et répète manuellement.');if(status)status.textContent='SpeechSynthesis unavailable — use the manual exercise.';return}const voices=speechVoices();const lang=String(requested||'de-DE');const wanted=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.split('-')[0].toLowerCase()));const german=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));if(!wanted.length&&!german){const message=lang.toLowerCase().startsWith('de')?'No German voice available — use the official audio links or read manually.':'No matching browser voice available — use the manual exercise.';if(status)status.textContent=message;toast(message);return}const utterance=new SpeechSynthesisUtterance(text);utterance.lang=wanted[0]?.lang|| (lang.toLowerCase().startsWith('de')?'de-DE':'fr-FR');utterance.voice=wanted[0]||german||voices[0];utterance.rate=0.84;utterance.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);if(status)status.textContent=`Playing with ${utterance.voice?.name||utterance.lang}.`}
function checkVoices(){const voices=speechVoices();const german=voices.filter(v=>v.lang?.toLowerCase().startsWith('de'));const status=$('#speechStatus');if(status)status.textContent=german.length?`German voice available: ${german[0].name} (${german[0].lang}).`:'No German voice available — use official audio or read manually.';toast(german.length?'German voice detected.':'No German voice detected; manual fallback is ready.')}
function checkMicrophone(){const status=$('#microphoneStatus');if(!microphoneSupport()){if(status)status.textContent='Browser microphone not supported — use the exercise manually.';toast('Microphone unavailable. Manual speaking mode is ready.');return}if(status)status.textContent='Microphone API available. Permission is requested only when you press Start recording.';toast('Microphone support detected.')}
async function startRecording(){const status=$('#microphoneStatus');if(!microphoneSupport()){if(status)status.textContent='Browser microphone not supported — use the exercise manually.';toast('Use the speaking prompt manually.');return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(mediaStream);recordChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(recordChunks,{type:'audio/webm'});const url=URL.createObjectURL(blob);if(status){status.innerHTML='Recording ready — listen to your attempt:<br><audio controls src="'+url+'" style="width:100%;margin-top:8px"></audio>'}};mediaRecorder.start();if(status)status.textContent='Recording… press Stop when you finish.';const start=$('[data-action="start-recording"]'),stop=$('[data-action="stop-recording"]');if(start)start.disabled=true;if(stop)stop.disabled=false}catch(error){console.warn('Microphone unavailable',error);if(status)status.textContent='Microphone permission was denied or unavailable — use the exercise manually.';toast('Microphone permission unavailable.')}}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();mediaStream?.getTracks().forEach(track=>track.stop());const start=$('[data-action="start-recording"]'),stop=$('[data-action="stop-recording"]');if(start)start.disabled=false;if(stop)stop.disabled=true}else toast('No recording is active.')}
function renderSearchResults(){const root=$('#searchResults'),input=$('#globalSearch');if(!root||!input)return;const q=input.value.trim();if(!q){root.classList.add('hidden');root.innerHTML='';return}const lower=q.toLowerCase();const results=[];LESSONS.forEach(l=>{if(lessonMatches(l,lower))results.push({type:'day',label:`Day ${l.day} · ${l.title}`,detail:l.objectives[0],day:l.day})});HISTORY.forEach((h,i)=>{if(`${h.date} ${h.event} ${h.what} ${h.vocab.join(' ')}`.toLowerCase().includes(lower))results.push({type:'history',label:`Timeline · ${h.date} · ${h.event}`,detail:'Culture & History',index:i})});LANDER.forEach(r=>{if(`${r.name} ${r.capital} ${r.region} ${r.fact}`.toLowerCase().includes(lower))results.push({type:'germany',label:`${r.name} · ${r.capital}`,detail:'Germany · Geography'})});GRAMMAR_TOPICS.forEach(g=>{if(`${g.title} ${g.explanation} ${g.examples.join(' ')}`.toLowerCase().includes(lower))results.push({type:'grammar',label:`Grammar · ${g.title}`,detail:g.level,id:g.id})});const limited=results.slice(0,14);root.classList.remove('hidden');root.innerHTML=limited.length?limited.map((r,i)=>`<button data-action="search-result" data-result-type="${r.type}" data-day="${r.day||''}" data-index="${r.index??''}" data-grammar="${r.id||''}"><strong>${escapeHTML(r.label)}</strong><small>${escapeHTML(r.detail)}</small></button>`).join(''):`<div class="empty" style="padding:15px">Aucun résultat pour « ${escapeHTML(q)} ».</div>`}
function submitHistory(){const selected=$('input[name="historyQuiz"]:checked');if(!selected){toast('Choisis une réponse.');return}const answer=Number(selected.value);state.historyAnswer=answer;const event=HISTORY[state.historyIndex];state.historyFeedback=answer===event.quiz.answer?`✓ Correct — ${event.quiz.explain}`:`✗ Incorrect — ${event.quiz.explain}`;render()}
function submitGeo(){const answers={};GEO_QUESTIONS.forEach((q,i)=>{const selected=$(`input[name="geo-${i}"]:checked`);if(selected)answers[i]=Number(selected.value)});state.geoQuizAnswers=answers;const missing=GEO_QUESTIONS.length-Object.keys(answers).length;if(missing){state.geoQuizFeedback=`Choisis encore ${missing} réponse(s) avant de vérifier.`;render();return}const score=GEO_QUESTIONS.reduce((sum,q,i)=>sum+(answers[i]===q.answer?1:0),0);state.geoQuizFeedback=`${score}/${GEO_QUESTIONS.length} · ${score===GEO_QUESTIONS.length?'✓ Parfait — '+GEO_QUESTIONS.map(q=>q.explain).join(' '):'Revois les cartes des Länder et retente le quiz.'}`;render()}
function submitTest(){const qs=testQuestions();const answers={};qs.forEach((q,i)=>{const selected=$(`input[name="test-${i}"]:checked`);if(selected)answers[`${state.testId}-${i}`]=Number(selected.value)});state.testAnswers={...state.testAnswers,...answers};const missing=qs.length-Object.keys(answers).length;if(missing){toast(`Réponds aux ${missing} question(s) restantes avant de soumettre.`);return}let correct=qs.reduce((sum,q,i)=>sum+(answers[`${state.testId}-${i}`]===q.answer?1:0),0);let total=qs.length;let openDone=0;if(state.testId==='final'){const tasks={};FINAL_TASKS.forEach(t=>{const checkbox=$(`[data-final-task="${t.id}"]`);tasks[t.id]=Boolean(checkbox?.checked);if(tasks[t.id])openDone++});state.finalTasks=tasks;correct+=openDone;total+=FINAL_TASKS.length}const weak=[...new Set(qs.filter((q,i)=>answers[`${state.testId}-${i}`]!==q.answer).map(q=>q.category))];const result={id:state.testId,score:correct,total,date:todayISO(),correct,weak,openDone};state.scores.push(result);state.testFeedback={...result};saveState();toast(`Test enregistré : ${Math.round(correct/total*100)}%`);render()}
function exportBackup(){const backup={app:'Deutsch 90',version:1,exportedAt:new Date().toISOString(),progress:{completed:state.completed,started:state.started,currentDay:state.currentDay},notes:state.notes,vocab:state.vocab,scores:state.scores,streak:state.streak,settings:state.settings};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='deutsch90-backup.json';document.body.appendChild(a);a.click();a.remove();window.setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup JSON exporté.')}
function validBackup(data){if(!data||typeof data!=='object'||data.app!=='Deutsch 90'||!data.progress||!Array.isArray(data.progress.completed)||!data.notes||typeof data.notes!=='object'||Array.isArray(data.notes)||!data.vocab||typeof data.vocab!=='object'||Array.isArray(data.vocab)||!Array.isArray(data.scores)||!data.streak||typeof data.streak!=='object'||!data.settings||typeof data.settings!=='object')return false;const completed=validDayList(data.progress.completed);if(completed.length!==data.progress.completed.length&&data.progress.completed.some(n=>!Number.isInteger(n)||n<1||n>90))return false;return true}
function importBackup(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!validBackup(data)){toast('Backup refusé : format invalide. Les données actuelles sont intactes.');return}state.completed=validDayList(data.progress.completed);state.started=Boolean(data.progress.started);state.currentDay=Math.min(90,Math.max(1,Number(data.progress.currentDay)||1));state.notes=data.notes;state.vocab=data.vocab;state.scores=data.scores.filter(s=>s&&Number.isFinite(s.score)&&Number.isFinite(s.total)&&s.total>0);state.streak={current:Number(data.streak.current)||0,best:Number(data.streak.best)||0,lastDate:typeof data.streak.lastDate==='string'?data.streak.lastDate:null};state.settings=cleanSettings(data.settings);applySettings();saveState();toast('Backup importé avec succès.');render()}catch(error){console.warn(error);toast('Backup refusé : JSON illisible. Les données actuelles sont intactes.')}};reader.onerror=()=>toast('Impossible de lire le fichier.');reader.readAsText(file)}
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');
 if(!target)return;
 const action=target.dataset.action;
 if(action==='navigate'){navigate(target.dataset.page);return}
 if(action==='toggle-menu'){toggleMenu();return}
 if(action==='start-journey'){startJourney();return}
 if(action==='continue'){state.currentDay=nextLearningDay();saveState();goToDay(state.currentDay);return}
 if(action==='start-day'||action==='open-day'){goToDay(Number(target.dataset.day));return}
 if(action==='back-program'){state.viewDay=null;render();return}
 if(action==='complete'){markComplete(Number(target.dataset.day));return}
 if(action==='incomplete'){markIncomplete(Number(target.dataset.day));return}
 if(action==='program-filter'){state.programFilter=target.dataset.filter;renderPage();return}
 if(action==='clear-program-filter'){state.programFilter='all';state.programQuery='';render();return}
 if(action==='vocab-show'){state.vocabShowAnswer=true;render();return}
 if(action==='vocab-know'){reviewVocab(true);return}
 if(action==='vocab-again'){reviewVocab(false);return}
 if(action==='vocab-next'){const cards=filteredVocabulary();if(cards.length)state.vocabIndex=(state.vocabIndex+1)%cards.length;state.vocabShowAnswer=false;render();return}
 if(action==='vocab-prev'){const cards=filteredVocabulary();if(cards.length)state.vocabIndex=(state.vocabIndex-1+cards.length)%cards.length;state.vocabShowAnswer=false;render();return}
 if(action==='vocab-mode'){state.vocabMode=state.vocabMode==='due'?'all':'due';state.vocabIndex=0;state.vocabShowAnswer=false;render();return}
 if(action==='vocab-category-pill'){state.vocabCategory=target.dataset.category;state.vocabIndex=0;render();return}
 if(action==='grammar-select'){state.grammarId=target.dataset.grammar;state.grammarAnswerShown=false;state.grammarFeedback='';render();return}
 if(action==='grammar-answer'){state.grammarAnswerShown=!state.grammarAnswerShown;render();return}
 if(action==='grammar-check'){checkGrammar();return}
 if(action==='speak-text'){speakText(target.dataset.text,target.dataset.lang||'de-DE');return}
 if(action==='check-voices'){checkVoices();return}
 if(action==='check-microphone'){checkMicrophone();return}
 if(action==='start-recording'){startRecording();return}
 if(action==='stop-recording'){stopRecording();return}
 if(action==='culture-tab'){state.cultureTab=target.dataset.tab;render();return}
 if(action==='history-select'){state.historyIndex=Number(target.dataset.index)||0;state.historyAnswer=undefined;state.historyFeedback='';render();return}
 if(action==='history-prev'){state.historyIndex=Math.max(0,state.historyIndex-1);state.historyAnswer=undefined;state.historyFeedback='';render();return}
 if(action==='history-next'){state.historyIndex=Math.min(HISTORY.length-1,state.historyIndex+1);state.historyAnswer=undefined;state.historyFeedback='';render();return}
 if(action==='history-check'){submitHistory();return}
 if(action==='germany-tab'){state.germanyTab=target.dataset.tab;render();return}
 if(action==='geo-submit'){submitGeo();return}
 if(action==='test-select'){state.testId=target.dataset.test;state.testFeedback=null;render();return}
 if(action==='submit-test'){submitTest();return}
 if(action==='export'){exportBackup();return}
 if(action==='import'){$('#importInput')?.click();return}
 if(action==='reset'){resetProgress();return}
 if(action==='search-result'){const type=target.dataset.resultType;$('#searchResults')?.classList.add('hidden');if(type==='day')goToDay(Number(target.dataset.day));else if(type==='history'){state.historyIndex=Number(target.dataset.index)||0;state.cultureTab='history';navigate('culture')}else if(type==='grammar'){state.grammarId=target.dataset.grammar||'pronouns';navigate('grammar')}else navigate('germany');return}
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='globalSearch'){renderSearchResults();return}
 if(el.matches('[data-note-field]')){const day=el.dataset.noteField;state.notes[day]=el.value;writeJSON(STORAGE.notes,state.notes);const status=$(`#note-status-${day}`);if(status)status.textContent='Saved locally · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});return}
 if(el.matches('[data-input="program-search"]')){state.programQuery=el.value;const pos=el.selectionStart;renderPage();const next=$('[data-input="program-search"]');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}return}
 if(el.matches('[data-input="vocab-search"]')){state.vocabSearch=el.value;state.vocabIndex=0;const pos=el.selectionStart;renderPage();const next=$('[data-input="vocab-search"]');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}return}
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.matches('[data-change="vocab-category"]')){state.vocabCategory=el.value;state.vocabIndex=0;render();return}
 if(el.matches('[data-change="setting-theme"]')){state.settings.theme=el.value;applySettings();saveState();render();toast('Thème enregistré.');return}
 if(el.matches('[data-change="setting-font"]')){state.settings.fontSize=el.value;applySettings();saveState();render();toast('Taille enregistrée.');return}
 if(el.matches('[data-change="setting-motion"]')){state.settings.reducedMotion=el.value==='true';applySettings();saveState();render();toast('Préférence d’animation enregistrée.');return}
});
$('#navOverlay')?.addEventListener('click',closeMenu);
$('#importInput')?.addEventListener('change',event=>{const file=event.target.files?.[0];if(file)importBackup(file);event.target.value=''});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeMenu();$('#searchResults')?.classList.add('hidden');closeWelcome()}});
loadState();
render();
</script>
